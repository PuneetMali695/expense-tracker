<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker – Track Income and Spending in ₹</title>
  <meta name="description" content="A free, simple expense tracker. Add income and expenses, see your balance and charts. Your data stays in your browser.">
  <link rel="stylesheet" href="style.css">
</head>

<body>
	<main class="app">
		<header>
			<h1>Expense Tracker</h1>
			<p>Track where your money goes in rupees.</p>
		</header>
		
		      <!--===== SECTION 1: SUMMARY =====-->
        <!-- Three boxes showing Balance, Income and Expenses -->
		<section class="summary">
		 <div class="box balance"><span>Balance</span><strong id="balance">₹0</strong></div>
         <div class="box income"><span>Income</span><strong id="income">₹0</strong></div>
         <div class="box expense"><span>Expenses</span><strong id="expense">₹0</strong></div>
         <div class="box savings"><span>Savings rate</span><strong id="savings">0%</strong></div>
       </section>
		
		<!-- ========== SECTION 2: ADD TRANSACTION FORM ========== -->
		<section class="card">	
		 <h2>Add transaction</h2>
				
		 <form id="form">
		 
		 <input type="text" id="title" placeholder="Title (e.g. Lunch)"required>
		 <input type="number" id="amount" placeholder="Amount" min="1" step="0.01" required>
		 
		 <!--Dropdown:money going out or coming in-->
		 <select id="type">
			<option value="expense">Expense</option>
			<option value="income">Income</option>
		</form>
		 </select>
		 
		 
        <!-- Dropdown for category. The text shown is the value saved -->		 
		 <select id="category">
			<option>Food</option>
			<option>Travel</option>
			<option>Shopping</option>
			<option>Bills</option>
			<option>Salary</option>
			<option>Others</option>
		 </select>
		
		
		 <input type="date" id="date" required>
		 <button type="submit" id="submitBtn">Add transaction</button>
		</section>
		
		
		<!--Charts-->
		<div class="charts">
		  <section class="card">
			<h2>Spending by category</h2>
			<div class="chart-box" id="pieBox">
				<canvas id="pieChart"></canvas>
			</div>
			<p id="noChart" class="empty">Add an expense to see the chart.</p>
		  </section>
		  
		  <section class="card">
			<h2>Income vs Expenses</h2>
			<div class="chart-box">
				<canvas id="barChart"></canvas>
			</div>
		  </section>
		</div> 
    
		<!--History-->
		<section class="card">
		  <div class="list-head">
			 <h2>History</h2>
			 <select id="filter" aria-label="Filter by type">
				<option value="all">All</option>
				<option value="income">Income</option>
				<option value="expense">Expense</option>
			 </select>
		  </div>
		  
		  <ul id="list"></ul>
		  <p id="empty" class="empty">No transations yet. Add your first one above.</p>
		  <button id="clearAll" class="clear">Clear all</button>
		</section>
	</main>

	  <!-- Chart.js library must come BEFORE our own script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
