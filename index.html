<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker – Track Income and Spending in ₹</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Expense Tracker</h1>
        <p>Track where your money goes in rupees.</p>
      </div>
      <div class="header-actions">
        <select id="monthSelect" class="month-select" aria-label="Select month"></select>
        <button type="button" id="exportCsv" class="btn-outline">Export CSV</button>
      </div>
    </header>

    <!-- Section 1: Summary KPIs -->
    <section class="summary">
      <div class="box balance">
        <span>Net Balance <em id="balanceBadge" class="badge surplus">Surplus</em></span>
        <strong id="balance">₹0.00</strong>
      </div>
      <div class="box income"><span>Total Income</span><strong id="income">₹0.00</strong></div>
      <div class="box expense"><span>Total Expenses</span><strong id="expense">₹0.00</strong></div>
      <div class="box savings">
        <span>Savings Rate</span>
        <strong id="savings">0.0%</strong>
        <div class="prog"><div id="savingsBar"></div></div>
      </div>
    </section>

    <!-- Section 2: Add Transaction -->
    <section class="card">
      <h2>Add Transaction</h2>
      <form id="form">
        <select id="type" aria-label="Transaction type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
        <select id="category" aria-label="Category" required>
          <option value="" disabled selected>Select Category</option>
        </select>
        <input type="text" id="customCat" placeholder="Custom category (optional)" hidden>
        <input type="text" id="title" placeholder="Description (e.g. Lunch)" required>
        <input type="number" id="amount" placeholder="Amount (₹)" min="1" step="0.01" required>
        <input type="date" id="date" required>
        <button type="submit" id="submitBtn">Add Transaction</button>
      </form>
    </section>

    <!-- Section 3: Charts -->
    <div class="charts">
      <section class="card">
        <div class="card-head">
          <h2>Spending by Category</h2>
          <span id="topCat" class="tag" hidden></span>
        </div>
        <div class="chart-box" id="pieBox"><canvas id="pieChart"></canvas></div>
        <p id="noChart" class="empty">Add an expense to see the chart.</p>
      </section>
      <section class="card">
        <h2>Income vs Expenses</h2>
        <div class="chart-box"><canvas id="barChart"></canvas></div>
      </section>
    </div>

    <!-- Section 4: History -->
    <section class="card">
      <div class="list-head">
        <h2>History</h2>
        <div class="controls">
          <input type="search" id="search" placeholder="Search...">
          <select id="filterType" aria-label="Filter by type">
            <option value="all">All Types</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
          <select id="filterCat" aria-label="Filter by category">
            <option value="all">All Categories</option>
          </select>
          <select id="sort" aria-label="Sort by amount">
            <option value="">Sort</option>
            <option value="asc">↑ Asc</option>
            <option value="desc">↓ Desc</option>
          </select>
        </div>
      </div>
      <ul id="list"></ul>
      <p id="empty" class="empty">No transactions for this period.</p>
      <button type="button" id="clearAll" class="clear">Clear All</button>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
